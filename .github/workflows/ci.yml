name: JNIIL CI

on:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JNIIL
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build everything with Java 8
        run: |
          ./gradlew shadowJar
          ./gradlew shadowJarTest
          ./gradlew testClasses

      - name: Upload Workspace Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jniil-workspace
          path: |
            .
            !**/.git/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [8, 11, 17, 21, 22, 25, 26]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Download Workspace Artifact
        uses: actions/download-artifact@v4
        with:
          name: jniil-workspace

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.java == 26 && '9.4.0' || matrix.java >= 25 && '9.1.0-rc-1' || 'wrapper' }}

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Run tests on Java ${{ matrix.java }}
        shell: bash
        run: |
          if [ "${{ matrix.java }}" -ge 25 ]; then
            if [ "${{ matrix.java }}" -eq 26 ]; then
              GRADLE_VERSION="9.4.0"
            else
              GRADLE_VERSION="9.1.0-rc-1"
            fi
            GRADLE_PATH="$RUNNER_TEMP/.gradle-actions/gradle-installations/installs/gradle-${GRADLE_VERSION}"
          
            if [ ! -d "$GRADLE_PATH" ]; then
              echo "Error: Gradle ${GRADLE_VERSION} not found"
              exit 1
            fi
          
            echo "Using Gradle ${GRADLE_VERSION} for Java ${{ matrix.java }}"
          
            if [ "${{ runner.os }}" = "Windows" ]; then
              "$GRADLE_PATH/bin/gradle.bat" test \
                -x compileJava \
                -x compileTestJava \
                -x shadowJar \
                -x shadowJarTest \
                -x processResources \
                -x testClasses \
                -x classes
            else
              "$GRADLE_PATH/bin/gradle" test \
                -x compileJava \
                -x compileTestJava \
                -x shadowJar \
                -x shadowJarTest \
                -x processResources \
                -x testClasses \
                -x classes
            fi
          else
            echo "Using Gradle Wrapper for Java ${{ matrix.java }}"
          
            if [ "${{ runner.os }}" = "Windows" ]; then
              ./gradlew.bat test \
                -x compileJava \
                -x compileTestJava \
                -x shadowJar \
                -x shadowJarTest \
                -x processResources \
                -x testClasses \
                -x classes
            else
              ./gradlew test \
                -x compileJava \
                -x compileTestJava \
                -x shadowJar \
                -x shadowJarTest \
                -x processResources \
                -x testClasses \
                -x classes
            fi
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-java${{ matrix.java }}
          path: build/test-results/test/