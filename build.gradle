plugins {
    id 'java'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
}

group = 'top.nontage'
version = '1.0.0'

repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation("top.nontage:jvm-context:1.0.0")
    implementation("org.javassist:javassist:3.30.2-GA")
    implementation("org.ow2.asm:asm:9.8")
    implementation("org.ow2.asm:asm-tree:9.8")
    implementation("org.ow2.asm:asm-util:9.8")
    implementation("org.ow2.asm:asm-commons:9.8")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.register('shadowJarTest', ShadowJar) {
    archiveClassifier.set('test')
    from sourceSets.main.output
    from sourceSets.main.resources
    configurations = [project.configurations.runtimeClasspath]
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.shadowJar {
    archiveClassifier.set(null)
    relocate 'javassist', 'top.nontage.relocated.javassist'
    relocate 'org.objectweb.asm', 'top.nontage.relocated.asm'
    mergeServiceFiles()
    configurations = [project.configurations.runtimeClasspath]
}

tasks.withType(Test).configureEach {
    dependsOn shadowJarTest
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true
    }

    def testJar = tasks.shadowJarTest.archiveFile.get().asFile
    classpath = files(testJar) +
            sourceSets.test.output.classesDirs +
            sourceSets.test.runtimeClasspath
}

tasks.withType(JavaExec).configureEach {
    dependsOn shadowJarTest
    def testJar = tasks.shadowJarTest.archiveFile.get().asFile
    classpath = files(testJar) + sourceSets.main.runtimeClasspath
}

test {
    include '**/*Test.class'
}

tasks.register('testStandard', Test) {
    include '**/StandardInjectorTest.class'
    group = 'verification'
}

tasks.register('testInstruction', Test) {
    include '**/InstructionInjectorTest.class'
    group = 'verification'
}

tasks.register('testFunctional', Test) {
    include '**/FunctionalInjectorTest.class'
    group = 'verification'
}

tasks.register('runFunctional', JavaExec) {
    mainClass = 'top.nontage.jniil.test.examples.FunctionalExample'
    group = 'application'
}

tasks.register('runStandard', JavaExec) {
    mainClass = 'top.nontage.jniil.test.examples.StandardExample'
    group = 'application'
}

tasks.register('runInstruction', JavaExec) {
    mainClass = 'top.nontage.jniil.test.examples.InstructionExample'
    group = 'application'
}

tasks.register('testMonitor', Test) {
    include '**/MonitorTest.class'
    group = 'verification'
}

tasks.register('runMonitor', JavaExec) {
    mainClass = 'top.nontage.jniil.test.examples.MonitorExample'
    group = 'application'
}

tasks.register('testAccessor', Test) {
    include '**/AccessorTest.class'
    group = 'verification'
}

tasks.register('testInjectionUtil', Test) {
    include '**/InjectionUtilTest.class'
    group = 'verification'
}

tasks.register('testUnsafeUtil', Test) {
    include '**/UnsafeUtilTest.class'
    group = 'verification'
}

tasks.register('testJvmContext', Test) {
    include '**/JvmContextDiagnosticTest.class'
    group = 'verification'
}

tasks.register("testClassInjector", Test) {
    include '**/ClassInjecotrTest.class'
    group = 'verification'
}

tasks.register('runAccessor', JavaExec) {
    mainClass = 'top.nontage.jniil.test.examples.AccessorExample'
    group = 'application'
}

tasks.register('runExample', JavaExec) {
    mainClass = 'top.nontage.jniil.test.Example'
    group = 'application'
}

tasks.build {
    dependsOn tasks.shadowJar
    dependsOn tasks.shadowJarTest
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:-sunapi"
    options.compilerArgs << "-XDignore.symbol.file"
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.shadowJar
            artifact tasks.shadowJarTest
            artifact tasks.sourcesJar

            pom.withXml {
                def dependenciesNode = asNode().appendNode('dependencies')
                configurations.implementation.allDependencies.each { dep ->
                    if (dep.group == 'top.nontage' && dep.name == 'jvm-context') {
                        def dependencyNode = dependenciesNode.appendNode('dependency')
                        dependencyNode.appendNode('groupId', dep.group)
                        dependencyNode.appendNode('artifactId', dep.name)
                        dependencyNode.appendNode('version', dep.version)
                        dependencyNode.appendNode('scope', 'runtime')
                    }
                }
            }
        }
    }
}