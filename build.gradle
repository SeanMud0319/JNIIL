plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'com.vanniktech.maven.publish' version '0.29.0' apply false
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

// Only apply maven-publish plugin if running on Java 11+
if (JavaVersion.current().isJava11Compatible()) {
    plugins.apply('com.vanniktech.maven.publish')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

group = 'top.nontage'
version = '1.0.0'

repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation("top.nontage:jvm-context:1.0.0")
    implementation("org.javassist:javassist:3.30.2-GA")
    implementation("org.ow2.asm:asm:9.8")
    implementation("org.ow2.asm:asm-tree:9.8")
    implementation("org.ow2.asm:asm-util:9.8")
    implementation("org.ow2.asm:asm-commons:9.8")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.register('shadowJarTest', ShadowJar) {
    archiveClassifier.set('test')
    from sourceSets.main.output
    from sourceSets.main.resources
    configurations = [project.configurations.runtimeClasspath]
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.shadowJar {
    archiveClassifier.set(null)
    relocate 'javassist', 'top.nontage.relocated.javassist'
    relocate 'org.objectweb.asm', 'top.nontage.relocated.asm'
    mergeServiceFiles()
    configurations = [project.configurations.runtimeClasspath]
}

tasks.withType(Test).configureEach {
    dependsOn shadowJarTest
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true
    }

    def testJar = tasks.shadowJarTest.archiveFile.get().asFile
    classpath = files(testJar) +
            sourceSets.test.output.classesDirs +
            sourceSets.test.runtimeClasspath
}

tasks.withType(JavaExec).configureEach {
    dependsOn shadowJarTest
    def testJar = tasks.shadowJarTest.archiveFile.get().asFile
    classpath = files(testJar) + sourceSets.main.runtimeClasspath
}

test {
    include '**/*Test.class'
}

tasks.register('testStandard', Test) {
    include '**/StandardInjectorTest.class'
    group = 'verification'
}

tasks.register('testInstruction', Test) {
    include '**/InstructionInjectorTest.class'
    group = 'verification'
}

tasks.register('testFunctional', Test) {
    include '**/FunctionalInjectorTest.class'
    group = 'verification'
}

tasks.register('runFunctional', JavaExec) {
    mainClass = 'top.nontage.jniil.test.examples.FunctionalExample'
    group = 'application'
}

tasks.register('runStandard', JavaExec) {
    mainClass = 'top.nontage.jniil.test.examples.StandardExample'
    group = 'application'
}

tasks.register('runInstruction', JavaExec) {
    mainClass = 'top.nontage.jniil.test.examples.InstructionExample'
    group = 'application'
}

tasks.register('testMonitor', Test) {
    include '**/MonitorTest.class'
    group = 'verification'
}

tasks.register('runMonitor', JavaExec) {
    mainClass = 'top.nontage.jniil.test.examples.MonitorExample'
    group = 'application'
}

tasks.register('testAccessor', Test) {
    include '**/AccessorTest.class'
    group = 'verification'
}

tasks.register('testInjectionUtil', Test) {
    include '**/InjectionUtilTest.class'
    group = 'verification'
}

tasks.register('testUnsafeUtil', Test) {
    include '**/UnsafeUtilTest.class'
    group = 'verification'
}

tasks.register('testJvmContext', Test) {
    include '**/JvmContextDiagnosticTest.class'
    group = 'verification'
}

tasks.register("testClassInjector", Test) {
    include '**/ClassInjecotrTest.class'
    group = 'verification'
}

tasks.register('runAccessor', JavaExec) {
    mainClass = 'top.nontage.jniil.test.examples.AccessorExample'
    group = 'application'
}

tasks.register('runExample', JavaExec) {
    mainClass = 'top.nontage.jniil.test.Example'
    group = 'application'
}

tasks.build {
    dependsOn tasks.shadowJar
    dependsOn tasks.shadowJarTest
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:-sunapi"
    options.compilerArgs << "-XDignore.symbol.file"
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractPublishToMaven) {
    dependsOn tasks.shadowJar
}

// Only configure publishing if the plugin is applied
if (project.plugins.hasPlugin('com.vanniktech.maven.publish')) {
    mavenPublishing {
        publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL)

        if (project.hasProperty('enablePublishing')) {
            signAllPublications()
        }

        coordinates(group, 'jniil', version)

        pom {
            name = 'jniil'
            description = 'Java Non-intrusive Instrumentation Library.'
            inceptionYear = '2026'
            url = 'https://github.com/SeanMud0319/JNIIL'
            licenses {
                license {
                    name = 'Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                }
            }
            developers {
                developer {
                    id = 'nontage'
                    name = 'Nontage'
                    email = 'whe91000@gmail.com'
                }
            }
            scm {
                url = 'https://github.com/SeanMud0319/JNIIL'
                connection = 'scm:git:git://github.com/SeanMud0319/JNIIL.git'
                developerConnection = 'scm:git:ssh://github.com:SeanMud0319/JNIIL.git'
            }
        }
    }
}