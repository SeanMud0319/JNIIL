plugins {
    id 'java'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
    //withJavadocJar()
}

group = 'top.nontage'
version = '1.0-SNAPSHOT'

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation("top.nontage:jvm-context:1.0.0")
    implementation("org.javassist:javassist:3.30.2-GA")
    implementation("org.ow2.asm:asm:9.8")
    implementation("org.ow2.asm:asm-tree:9.8")
    implementation("org.ow2.asm:asm-util:9.8")
    implementation("org.ow2.asm:asm-commons:9.8")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true
    }
}

tasks.register('testStandard', Test) {
    useJUnitPlatform()
    include '**/StandardInjectorTest.class'
    group = 'verification'
    description = 'Runs StandardMethodInjector tests'
}

tasks.register('testInstruction', Test) {
    useJUnitPlatform()
    include '**/InstructionInjectorTest.class'
    group = 'verification'
    description = 'Runs InstructionInjector tests'
}

tasks.register('testFunctional', Test) {
    useJUnitPlatform()
    include '**/FunctionalInjectorTest.class'
    group = 'verification'
    description = 'Runs FunctionalInjector tests'
}

tasks.register('runFunctional', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.nontage.jniil.test.examples.FunctionalExample'
    group = 'application'
    description = 'Runs FunctionalInjector example'
}

tasks.register('runStandard', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.nontage.jniil.test.examples.StandardExample'
    group = 'application'
    description = 'Runs StandardMethodInjector example'
}

tasks.register('runInstruction', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.nontage.jniil.test.examples.InstructionExample'
    group = 'application'
    description = 'Runs InstructionInjector example'
}

tasks.register('testMonitor', Test) {
    useJUnitPlatform()
    include '**/MonitorTest.class'
    group = 'verification'
    description = 'Runs InvocationMonitor tests'
}

tasks.register('runMonitor', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.nontage.jniil.test.examples.MonitorExample'
    group = 'application'
    description = 'Runs InvocationMonitor example'
}

tasks.register('testAccessor', Test) {
    useJUnitPlatform()
    include '**/AccessorTest.class'
    group = 'verification'
    description = 'Runs Accessor tests'
}

tasks.register('testInjectionUtil', Test) {
    useJUnitPlatform()
    include '**/InjectionUtilTest.class'
    group = 'verification'
    description = 'Runs InjectionUtil tests'
}

tasks.register('testUnsafeUtil', Test) {
    useJUnitPlatform()
    include '**/UnsafeUtilTest.class'
    group = 'verification'
    description = 'Runs UnsafeUtilTest tests'
}

tasks.register('testJvmContext', Test) {
    useJUnitPlatform()
    include '**/JvmContextDiagnosticTest.class'
    group = 'verification'
}

tasks.register('runAccessor', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.nontage.jniil.test.examples.AccessorExample'
    group = 'application'
    description = 'Runs Accessor example'
}

tasks.register('runExample', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.nontage.jniil.test.Example'
    group = 'application'
    description = 'Runs the main Example entry point'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:-sunapi"
    options.compilerArgs << "-XDignore.symbol.file"
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.shadowJar {
    archiveClassifier.set(null)
    relocate 'javassist', 'top.nontage.relocated.javassist'
    relocate 'org.objectweb.asm', 'top.nontage.relocated.asm'
    mergeServiceFiles()
    configurations = [project.configurations.runtimeClasspath]
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}